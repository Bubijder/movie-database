<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <nav class="sectionMenuBar">
        
        <div class="languageSection">
            <i class="fa-solid fa-globe"></i>
            <select onchange="window.location.href = this.value;">
                <option value="index.html">EN</option>
                <option value="ro.html">RO</option>
            </select>

        </div>

        <button onclick="showSection('movieSection')">Movies</button>
        <button onclick="showSection('statistics')">Statistics</button>
        <button onclick="showSection('readMe')">Info</button>

    </nav>

    <section id="movieSection" class="sections">
        
        <div id="searchBar">
            <p><i>To search for a movie you can type in the name or select tags from the dropdown.</i></p>
            <input type="text" id="movieFind" placeholder="Search for a movie...">
            <select id="searchTags">
                <option></option>
            </select>

            <div id="tagSection">

            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Movie name</th>
                    <th>Categories</th>
                    <th onclick="sortProperty('release_date')">Release date</th>
                    <th onclick="sortProperty('general_rating')">General rating</th>
                    <th onclick="sortProperty('personal_rating')">My rating</th>
                </tr>
            </thead>
            <tbody id="movieTable">
    
            </tbody>
        </table>

        <dialog id="dialogOpen">

        </dialog>

    </section>

    <script src="database.js"></script>
    <script src="script.js"></script>
</body>

</html>
